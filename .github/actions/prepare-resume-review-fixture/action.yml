name: Prepare shared resume review contract
description: Generate the exact native resource through the shared parser producer
runs:
  using: composite
  steps:
    - name: Resolve the shared contract producer
      id: contract
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        contract = json.loads(Path('scripts/ci/resume-review/contract.json').read_text())
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print('paired=' + str(not Path('tests/fixtures/resume_contract.py').is_file()).lower(), file=output)
            print('revision=' + contract['parser_ref'], file=output)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      if: steps.contract.outputs.paired == 'true'
      with:
        repository: ${{ github.repository }}
        ref: ${{ steps.contract.outputs.revision }}
        path: .jac/resume-contract-source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Generate and verify canonical resource bytes
      shell: bash
      run: python3 scripts/ci/resume-review/prepare.py
