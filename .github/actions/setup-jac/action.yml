name: Set up pinned Jac
description: Install the checksum-pinned Jac 0.37.21 runtime and, optionally, server dependencies.
inputs:
  install-dependencies:
    description: Run `jac install --no-npm` after installing the runtime.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install pinned Jac runtime
      shell: bash
      run: |
        set -euo pipefail
        runtime=jac-0.37.21-linux-x86_64
        # Pinned here rather than read from the release, so a replaced release asset fails closed.
        sha256=1f4385aca73182f90ca0bf2dd887713df6e0530115e0835dc09e396256a7333d
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 2 "https://github.com/jaseci-labs/jac/releases/download/v0.37.21/$runtime" --output "$runtime"
        echo "$sha256  $runtime" | sha256sum --check
        chmod +x "$runtime"
        mkdir -p "$RUNNER_TEMP/jac-bin"
        mv "$runtime" "$RUNNER_TEMP/jac-bin/jac"
        echo "$RUNNER_TEMP/jac-bin" >> "$GITHUB_PATH"
    - name: Install server dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: jac install --no-npm
