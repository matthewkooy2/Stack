name: Application autofill
on:
  pull_request:
    paths:
      - 'agents/**'
      - 'core/automation.jac'
      - 'main.jac'
      - 'deploy/browser_package.py'
      - 'tests/*autofill*'
      - 'tests/*browser*'
      - '.github/workflows/application-autofill.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-autofill-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  fixtures:
    name: Synthetic ATS and authenticated lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAC_DB_SCRATCH: '1'
      JAC_TEST_JOBS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser fixture runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Exercise four synthetic ATS families without employer contact
        run: python -m unittest discover -s tests -p test_autofill.py -v
      - uses: ./.github/actions/setup-jac
      - name: Verify authenticated lifecycle and existing takeover boundaries
        run: jac test tests/autofill_workflow_tests.jac tests/application_retirement_tests.jac tests/browser_viewer_tests.jac
      - name: Verify browser worker and source package
        run: |
          set -euo pipefail
          for suite in test_browser_control.py test_browser_service.py test_browser_stream.py test_browser_preview.py; do
            jac run --no-serve "tests/$suite"
          done
          python -m unittest discover -s tests -p test_backend_release.py -v
