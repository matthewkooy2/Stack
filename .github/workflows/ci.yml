name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: Backend and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Install the pinned credential scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Check fixture source representation without historical exceptions
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" dir tests/fixtures
          --gitleaks-ignore-path /dev/null --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Check native fixture source without historical exceptions
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir scripts/ci/resume-review --gitleaks-ignore-path /dev/null --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Scan public Git history for developer credentials
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Install documented machine prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3-venv ca-certificates curl tar xz-utils libfontconfig1
      - name: Bootstrap a clean public checkout
        run: python3 scripts/contributor.py setup
      - name: Check server, web and native modules
        run: >-
          scripts/jac check main.jac web/main.jac mobile/main.jac
          core/automation.jac core/stories.jac
          agents/provider.jac agents/worker.jac agents/gateway.jac agents/local_model.jac agents/contracts.jac
          agents/notifications.jac agents/tracing.jac agents/resume_processing.jac agents/experience.jac
          scripts/agent-admin.jac
      - name: Run approved backend safety cases
        run: python3 scripts/ci/core-tests.py
      - name: Start services and verify account and saved practice persistence
        run: |
          python3 scripts/contributor.py dev --smoke
          python3 scripts/contributor.py setup
          python3 scripts/contributor.py dev --smoke
  ci-ok:
    # Backend deployment still waits only for backend/security verification.
    name: CI passed
    if: always()
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - name: Require backend and security success
        env:
          RESULT: ${{ needs.core.result }}
        run: test "$RESULT" = success
