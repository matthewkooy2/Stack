name: Dependency security
on:
  pull_request:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  policy:
    name: Security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_security_audit.py -v
      - run: python scripts/security_audit.py exceptions
  npm:
    name: npm audit (${{ matrix.target }})
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [native, web, mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - run: python scripts/security_audit.py npm "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-npm-${{ matrix.target }}
          path: |
            .jac/security/npm-${{ matrix.target }}/audit.json
            .jac/security/npm-${{ matrix.target }}/package.json
            .jac/security/npm-${{ matrix.target }}/package-lock.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  python:
    name: pip-audit (${{ matrix.target }})
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [api, browser, discovery]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/security-requirements.txt
      - run: python scripts/security_audit.py python "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-python-${{ matrix.target }}
          path: |
            .jac/security/python-${{ matrix.target }}/audit.json
            .jac/security/python-${{ matrix.target }}/requirements.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: Dependency security gate
    if: always()
    needs: [policy, npm, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every scan to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os,sys; jobs=json.loads(os.environ["RESULTS"]); sys.exit(0 if all(job["result"] == "success" for job in jobs.values()) else 1)'
