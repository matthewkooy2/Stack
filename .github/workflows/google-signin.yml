name: Google identity sign-in
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  google-signin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAC_DB_SCRATCH: '1'
      JAC_TEST_JOBS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Install pinned Jac runtime
        run: |
          set -euo pipefail
          runtime=jac-0.37.21-linux-x86_64
          url=https://github.com/jaseci-labs/jac/releases/download/v0.37.21
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 "$url/$runtime" --output "$runtime"
          curl --fail --location --retry 2 "$url/$runtime.sha256" --output "$runtime.sha256"
          sha256sum --check "$runtime.sha256"
          chmod +x "$runtime"
          mkdir -p "$RUNNER_TEMP/jac-bin"
          mv "$runtime" "$RUNNER_TEMP/jac-bin/jac"
          echo "$RUNNER_TEMP/jac-bin" >> "$GITHUB_PATH"
      - name: Install server dependencies
        run: jac install --no-npm
      - name: Check gateway and web/native authentication UI
        run: jac check agents/gateway.jac web/main.jac mobile/main.jac
      - name: Verify browser and native handoff boundaries
        run: node tests/google_signin_clients.cjs
      - name: Verify disposable identities and gateway fixtures
        run: jac test tests/google_signin_tests.jac tests/google_signin_gateway_tests.jac
