name: iOS signing configuration
on:
  pull_request:
    paths:
      - '.github/workflows/*testflight.yml'
      - '.github/workflows/ios-signing.yml'
      - 'scripts/ci/ios*testflight.sh'
      - 'scripts/ci/ios-signing.py'
      - 'tests/test_ios_signing.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*testflight.yml'
      - '.github/workflows/ios-signing.yml'
      - 'scripts/ci/ios*testflight.sh'
      - 'scripts/ci/ios-signing.py'
      - 'tests/test_ios_signing.py'
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify signing configuration without secrets or Apple access
        run: |
          python3 -m unittest discover -s tests -p test_ios_signing.py -v
          bash -n scripts/ci/ios-testflight.sh scripts/ci/ios-swift-testflight.sh
