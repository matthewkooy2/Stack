name: Stack SwiftUI app
# A separate route for the native Swift rebuild in ios/. It signs and uploads nothing, and the Expo app,
# the TestFlight workflow and the `CI passed` gate do not depend on it.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'mobile/feature-rpcs.js'
      - 'scripts/ci/ios-swift.sh'
      - 'scripts/ci/ios-swift-testflight.sh'
      - '.github/workflows/swift-testflight.yml'
      - 'scripts/ci/resume-review/**'
      - '.github/actions/prepare-resume-review-fixture/**'
      - 'scripts/ci/ios-swift-static.py'
      - 'scripts/ci/ios-listing-fixture-server.py'
      - 'scripts/ci/ios-xcresult-attachments.py'
      - 'tests/test_ios_swift_static.py'
      - 'tests/test_resume_review_fixture.py'
      - 'tests/test_ios_xcresult_attachments.py'
      - '.github/workflows/ios-swift.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'mobile/feature-rpcs.js'
      - 'scripts/ci/ios-swift.sh'
      - 'scripts/ci/ios-swift-testflight.sh'
      - '.github/workflows/swift-testflight.yml'
      - 'scripts/ci/resume-review/**'
      - '.github/actions/prepare-resume-review-fixture/**'
      - 'scripts/ci/ios-swift-static.py'
      - 'scripts/ci/ios-listing-fixture-server.py'
      - 'scripts/ci/ios-xcresult-attachments.py'
      - 'tests/test_ios_swift_static.py'
      - 'tests/test_resume_review_fixture.py'
      - 'tests/test_ios_xcresult_attachments.py'
      - '.github/workflows/ios-swift.yml'
  workflow_dispatch:
    inputs:
      listing_error_text:
        description: Observed Safari connection-error label for this simulator OS and locale
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ios-swift-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: Swift structure and backend contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Verify fixture preparation fails closed
        run: python3 -m unittest discover -s tests -p test_resume_review_fixture.py -v
      - name: Check delimiters, types and published backend functions
        run: python3 -m unittest discover -s tests -p test_ios_swift_static.py -v
      - name: Check the result-attachment exporter
        run: python3 -m unittest discover -s tests -p test_ios_xcresult_attachments.py -v
      - name: Check the Swift sources
        run: bash scripts/ci/ios-swift.sh static

  build-and-test:
    name: Build and unit tests (Xcode)
    needs: static
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test for the simulator
        env:
          # The API origin is only compiled into Info.plist; tests use stubbed transport.
          STACK_API_URL: https://stack.invalid
          STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
          STACK_LISTING_ERROR_TEXT: ${{ inputs.listing_error_text || 'Can’t Open Page' }}
        run: |
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > "$RUNNER_TEMP/listing-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health
          bash scripts/ci/ios-swift.sh test
      - name: Build the unsigned Release candidate
        if: always()
        env:
          STACK_API_URL: https://stack.invalid
          STACK_IOS_CONFIGURATION: Release
        run: bash scripts/ci/ios-swift.sh build
      # Evidence only: a raw .xcresult cannot be read off macOS, so its kept screenshots are exported to PNG.
      # This step never changes the job's result; the build and test step above owns it. Failures to export are
      # written to evidence/manifest.json and shown as warnings.
      - name: Export kept screenshots from the result bundle
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/ci-ios-swift/*.xcresult)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "No result bundle was produced; nothing to export."
            exit 0
          fi
          python3 scripts/ci/ios-xcresult-attachments.py --output .jac/ci-ios-swift/evidence "${bundles[@]}"
      - name: Keep the result bundle and exported screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-swift-results-${{ github.run_number }}
          path: |
            .jac/ci-ios-swift/*.xcresult
            .jac/ci-ios-swift/evidence
          if-no-files-found: ignore
          retention-days: 7

  release-lane:
    # The TestFlight upload runs this whole suite on this toolchain before archiving. Run it here first so a
    # release is never the first execution of a test on the shipped SDK.
    name: Build and tests (Xcode 27 release lane)
    needs: static
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test for the simulator
        env:
          STACK_API_URL: https://stack.invalid
          STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
          STACK_LISTING_ERROR_TEXT: ${{ inputs.listing_error_text || 'Can’t Open Page' }}
        run: |
          xcodebuild -version
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > "$RUNNER_TEMP/listing-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health
          bash scripts/ci/ios-swift.sh test
      - name: Build the unsigned Release candidate
        if: always()
        env:
          STACK_API_URL: https://stack.invalid
          STACK_IOS_CONFIGURATION: Release
        run: bash scripts/ci/ios-swift.sh build
      - name: Export kept screenshots from the result bundle
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/ci-ios-swift/*.xcresult)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "No result bundle was produced; nothing to export."
            exit 0
          fi
          python3 scripts/ci/ios-xcresult-attachments.py --output .jac/ci-ios-swift/evidence "${bundles[@]}"
      - name: Keep the result bundle and exported screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-swift-release-lane-results-${{ github.run_number }}
          path: |
            .jac/ci-ios-swift/*.xcresult
            .jac/ci-ios-swift/evidence
          if-no-files-found: ignore
          retention-days: 7
