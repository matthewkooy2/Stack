name: Focused native durable fix proof
# Diagnostic branch only. Never merged. Signs, uploads and deploys nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Focused ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: resume proof xcode 15.4
            runner: macos-14
            developer_dir: ''
            mode: resume
          - name: resume proof xcode 27
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
            mode: resume
          - name: release evidence xcode 27
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
            mode: release
    env:
      STACK_API_URL: https://stack.invalid
      STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
      STACK_LISTING_FIXTURE_PORT: '18765'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run focused repeated tests
        env:
          MODE: ${{ matrix.mode }}
          SELECTED_DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: |
          set -uo pipefail
          if [[ -n "$SELECTED_DEVELOPER_DIR" ]]; then export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"; fi
          out=.jac/focused
          mkdir -p "$out"
          xcodebuild -version | tee "$out/toolchain.txt"
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > "$out/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health || exit 1
          name=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^ (]\) (.*/\1/p' | head -n 1)
          echo "simulator=$name" | tee -a "$out/toolchain.txt"
          python3 scripts/ci/resume-review/prepare.py
          (cd ios && xcodegen generate --spec project.yml --project .)
          common=(-project ios/Stack.xcodeproj -scheme Stack -configuration Debug
            -destination "platform=iOS Simulator,name=$name" -derivedDataPath "$out/DerivedData"
            -parallel-testing-enabled NO)
          settings=(STACK_LISTING_FIXTURE_PORT=18765 STACK_LISTING_REQUIRE_ACCEPTANCE=1
            "STACK_LISTING_ERROR_TEXT=Can’t Open Page" STACK_API_URL=https://stack.invalid
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${common[@]}" "${settings[@]}" > "$out/build.log" 2>&1 || { tail -80 "$out/build.log"; exit 1; }
          status=0
          run() {
            local label=$1; shift
            echo "::group::$label"
            xcodebuild test-without-building "${common[@]}" -resultBundlePath "$out/$label.xcresult" "$@" "${settings[@]}" \
              2>&1 | grep -E "Test Case|error:|Executed|iteration|Test Suite" || true
            local code=${PIPESTATUS[0]}
            echo "$label exit=$code" | tee -a "$out/summary.txt"
            echo "::endgroup::"
            [[ $code -eq 0 ]] || status=1
          }
          if [[ "$MODE" == resume ]]; then
            run resume-target-x3 -test-iterations 3 \
              -only-testing:StackUITests/ResumeReviewFlowUITests/testEntriesBulletsAndOrderSurviveClosingAndReopening
            run resume-class -only-testing:StackUITests/ResumeReviewFlowUITests
          else
            run keyboard-x3 -test-iterations 3 \
              -only-testing:StackUITests/AccessFlowTests/testNamedFieldsAndKeyboardValidation
            run safari-class-x2 -test-iterations 2 -only-testing:StackUITests/JobListingSafariUITests
          fi
          cat "$out/summary.txt"
          exit $status
      - name: Export screenshots and geometry
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/focused/*.xcresult)
          [ ${#bundles[@]} -eq 0 ] || python3 scripts/ci/ios-xcresult-attachments.py --output .jac/focused/evidence "${bundles[@]}"
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-${{ matrix.mode }}-${{ matrix.runner }}-${{ github.sha }}
          path: |
            .jac/focused/evidence
            .jac/focused/summary.txt
            .jac/focused/toolchain.txt
            .jac/focused/fixture.log
          retention-days: 7
