name: Focused flaky runner run loop A/B
# Diagnostic branch only. Never merged. Signs, uploads and deploys nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Focused ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flaky run loop ab xcode 15.4
            runner: macos-14
            developer_dir: ''
            mode: flaky
    env:
      STACK_API_URL: https://stack.invalid
      STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
      STACK_LISTING_FIXTURE_PORT: '18765'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run focused repeated tests
        env:
          MODE: ${{ matrix.mode }}
          SELECTED_DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: |
          set -uo pipefail
          if [[ -n "$SELECTED_DEVELOPER_DIR" ]]; then export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"; fi
          out=.jac/focused
          mkdir -p "$out"
          xcodebuild -version | tee "$out/toolchain.txt"
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > "$out/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health || exit 1
          name=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^ (]\) (.*/\1/p' | head -n 1)
          echo "simulator=$name" | tee -a "$out/toolchain.txt"
          udid=$(xcrun simctl list devices available -j | NAME="$name" python3 -c 'import json,os,sys; print(next(d["udid"] for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"]==os.environ["NAME"]))')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl spawn "$udid" log stream --style compact --level default \
            --predicate 'process == "SafariViewService" OR process BEGINSWITH "com.apple.WebKit" OR process == "Stack"' \
            > "$out/simulator-safari.log" 2>&1 &
          log_pid=$!
          trap 'kill "$fixture_pid" "$log_pid" 2>/dev/null || true' EXIT
          python3 scripts/ci/resume-review/prepare.py
          (cd ios && xcodegen generate --spec project.yml --project .)
          common=(-project ios/Stack.xcodeproj -scheme Stack -configuration Debug
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath "$out/DerivedData"
            -parallel-testing-enabled NO)
          settings=(STACK_LISTING_FIXTURE_PORT=18765 STACK_LISTING_REQUIRE_ACCEPTANCE=1
            "STACK_LISTING_ERROR_TEXT=Can’t Open Page" STACK_API_URL=https://stack.invalid
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${common[@]}" "${settings[@]}" > "$out/build.log" 2>&1 || { tail -80 "$out/build.log"; exit 1; }
          status=0
          run() {
            local label=$1; shift
            echo "::group::$label"
            local code=0
            xcodebuild test-without-building "${common[@]}" -resultBundlePath "$out/$label.xcresult" "$@" "${settings[@]}" \
              > "$out/$label.log" 2>&1 || code=$?
            grep -E "Test Case|error:|Executed|Test Suite|DIAG-SPEECH|SpeechFramework|Restarting after|DIAG-FLAKY" "$out/$label.log" || true
            echo "$label exit=$code" | tee -a "$out/summary.txt"
            echo "::endgroup::"
            [[ $code -eq 0 || -n "${EXPECT_FAILURE:-}" ]] || status=1
          }
          for round in 1 2 3 4 5; do
            run "baseline-r$round" -test-iterations 2 -only-testing:StackUITests/JobListingSafariUITests/testDiagBlockingBaselineFailedConnection
            run "runloop-r$round" -test-iterations 2 -only-testing:StackUITests/JobListingSafariUITests/testFailedConnectionThenReloadRecovers
          done
          cat "$out/summary.txt"
          exit $status
      - name: Export screenshots and geometry
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/focused/*.xcresult)
          [ ${#bundles[@]} -eq 0 ] || python3 scripts/ci/ios-xcresult-attachments.py --output .jac/focused/evidence "${bundles[@]}"
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-${{ matrix.mode }}-${{ matrix.runner }}-${{ github.sha }}
          path: |
            .jac/focused/evidence
            .jac/focused/summary.txt
            .jac/focused/toolchain.txt
            .jac/focused/fixture.log
            .jac/focused/*.log
          retention-days: 7
