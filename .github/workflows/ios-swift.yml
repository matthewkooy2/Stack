name: Focused disclosure transition acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Disclosure tap proof ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            developer_dir: ''
          - runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
    env:
      STACK_API_URL: https://stack.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Repeat uninstrumented disclosure transition and its class
        env:
          SELECTED_DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: |
          set -uo pipefail
          if [[ -n "$SELECTED_DEVELOPER_DIR" ]]; then export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"; fi
          out=.jac/disclosure
          mkdir -p "$out"
          xcodebuild -version | tee "$out/toolchain.txt"
          name=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^ (]\) (.*/\1/p' | head -n 1)
          echo "simulator=$name" | tee -a "$out/toolchain.txt"
          python3 scripts/ci/resume-review/prepare.py
          (cd ios && xcodegen generate --spec project.yml --project .)
          common=(-project ios/Stack.xcodeproj -scheme Stack -configuration Debug
            -destination "platform=iOS Simulator,name=$name" -derivedDataPath "$out/DerivedData"
            -parallel-testing-enabled NO)
          settings=(STACK_API_URL=https://stack.invalid CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${common[@]}" "${settings[@]}" > "$out/build.log" 2>&1 || { tail -80 "$out/build.log"; exit 1; }
          status=0
          for method in testMixedAutofillAndModelSetupIsDeduplicatedAndUnavailableActionIsDisabled class; do
            code=0
            iterations=6; selector="StackUITests/ScreenFlowUITests/$method"
            if [[ "$method" == class ]]; then iterations=1; selector=StackUITests/ScreenFlowUITests; fi
            xcodebuild test-without-building "${common[@]}" -resultBundlePath "$out/$method.xcresult" \
              -test-iterations "$iterations" "-only-testing:$selector" "${settings[@]}" > "$out/$method.log" 2>&1 || code=$?
            grep -E 'Test Case|error:|Executed|Restarting after' "$out/$method.log" || true
            echo "$method exit=$code" | tee -a "$out/summary.txt"
            [[ $code -eq 0 ]] || status=1
          done
          exit $status
      - name: Export screenshots and geometry
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/disclosure/*.xcresult)
          [ ${#bundles[@]} -eq 0 ] || python3 scripts/ci/ios-xcresult-attachments.py --output .jac/disclosure/evidence "${bundles[@]}"
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disclosure-${{ matrix.runner }}-${{ github.sha }}
          path: |
            .jac/disclosure/evidence
            .jac/disclosure/*.log
            .jac/disclosure/toolchain.txt
            .jac/disclosure/summary.txt
          retention-days: 7
