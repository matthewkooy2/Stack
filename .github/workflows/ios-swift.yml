name: Focused native listing diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listing-diagnostics:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      STACK_API_URL: https://stack.invalid
      STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
      STACK_LISTING_FIXTURE_PORT: '18765'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Reproduce the two Close failures and one passing comparison
        run: |
          set -euo pipefail
          mkdir -p .jac/listing-diagnostics
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > .jac/listing-diagnostics/fixture.log 2>&1 &
          fixture_pid=$!
          log_pid=''
          simulator_id=''
          cleanup() {
            app_data=$(xcrun simctl get_app_container "$simulator_id" com.matthewkooy.stack.swift data 2>/dev/null) || true
            if [[ -n "$app_data" && -f "$app_data/Library/Application Support/stack-listing-lifecycle.log" ]]; then
              cp "$app_data/Library/Application Support/stack-listing-lifecycle.log" .jac/listing-diagnostics/lifecycle-durable.log
            fi
            kill "$fixture_pid" ${log_pid:+"$log_pid"} 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl spawn "$simulator_id" log stream --level debug --style compact --predicate 'eventMessage CONTAINS "Stack listing browser lifecycle"' > .jac/listing-diagnostics/lifecycle.log 2>&1 &
          log_pid=$!
          python3 scripts/ci/resume-review/prepare.py
          (cd ios && xcodegen generate --spec project.yml --project .)
          xcodebuild test -project ios/Stack.xcodeproj -scheme Stack -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath .jac/listing-diagnostics/DerivedData \
            -resultBundlePath .jac/listing-diagnostics/test.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:StackUITests/JobListingSafariUITests/testCloseThenReopenShowsTheListingAgain \
            -only-testing:StackUITests/JobListingSafariUITests/testLongTitleListingRendersAndCloses \
            -only-testing:StackUITests/JobListingSafariUITests/testRedirectLandsOnDestination \
            STACK_LISTING_FIXTURE_PORT=18765 STACK_LISTING_REQUIRE_ACCEPTANCE=1 \
            STACK_API_URL=https://stack.invalid CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Export the actual native screenshots and geometry
        if: always()
        run: |
          python3 scripts/ci/ios-xcresult-attachments.py --output .jac/listing-diagnostics/evidence .jac/listing-diagnostics/test.xcresult
      - name: Retain focused evidence without claiming full acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listing-lifecycle-${{ github.sha }}
          path: |
            .jac/listing-diagnostics/test.xcresult
            .jac/listing-diagnostics/evidence
            .jac/listing-diagnostics/lifecycle.log
            .jac/listing-diagnostics/lifecycle-durable.log
            .jac/listing-diagnostics/fixture.log
          retention-days: 7
