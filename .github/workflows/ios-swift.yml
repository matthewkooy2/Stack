name: Focused Safari startup and failure cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Safari trace ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
          - runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      STACK_API_URL: https://stack.invalid
      STACK_LISTING_REQUIRE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-resume-review-fixture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Trace focused startup and cleanup
        env:
          SELECTED_DEVELOPER_DIR: ${{ matrix.developer_dir }}
        run: |
          set -uo pipefail
          export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"
          out=.jac/safari-trace
          mkdir -p "$out"
          xcodebuild -version | tee "$out/toolchain.txt"
          python3 scripts/ci/ios-listing-fixture-server.py --port 18765 > "$out/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health || exit 1
          name=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^ (]\) (.*/\1/p' | head -n 1)
          echo "simulator=$name" | tee -a "$out/toolchain.txt"
          python3 scripts/ci/resume-review/prepare.py
          (cd ios && xcodegen generate --spec project.yml --project .)
          common=(-project ios/Stack.xcodeproj -scheme Stack -configuration Debug
            -destination "platform=iOS Simulator,name=$name" -derivedDataPath "$out/DerivedData"
            -parallel-testing-enabled NO)
          settings=(STACK_LISTING_FIXTURE_PORT=18765 STACK_LISTING_REQUIRE_ACCEPTANCE=1
            "STACK_LISTING_ERROR_TEXT=Can’t Open Page" STACK_API_URL=https://stack.invalid
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${common[@]}" "${settings[@]}" > "$out/build.log" 2>&1 || { tail -80 "$out/build.log"; exit 1; }
          status=0
          run() {
            local label=$1; shift
            code=0
            xcodebuild test-without-building "${common[@]}" -resultBundlePath "$out/$label.xcresult" "$@" "${settings[@]}" \
              > "$out/$label.log" 2>&1 || code=$?
            grep -E 'Test Case|error:|Executed|Restarting after|SAFARI|FIXTURE' "$out/$label.log" || true
            echo "$label exit=$code" | tee -a "$out/summary.txt"
            [[ $code -eq 0 || -n "${EXPECT_FAILURE:-}" ]] || status=1
          }
          run cold-listing-x3 -test-iterations 3 -only-testing:StackUITests/JobListingSafariUITests/testCloseThenReopenShowsTheListingAgain
          run recovery-x3 -test-iterations 3 -only-testing:StackUITests/JobListingSafariUITests/testFailedConnectionThenReloadRecovers
          EXPECT_FAILURE=1 run intentional-cleanup-failure -only-testing:StackUITests/JobListingSafariUITests/testDeliberateFailureStillCompletesAsyncCleanup
          grep -q 'intentional diagnostic assertion' "$out/intentional-cleanup-failure.log" || status=1
          grep -q 'SAFARI teardown complete' "$out/intentional-cleanup-failure.log" || status=1
          exit $status
      - name: Retain direct screenshots even if the result bundle is unfinished
        if: always()
        run: |
          out=.jac/safari-trace
          runner_id=$(python3 - <<'PY'
          import pathlib,plistlib
          for path in pathlib.Path('.jac/safari-trace/DerivedData/Build/Products').rglob('StackUITests-Runner.app/Info.plist'):
              print(plistlib.loads(path.read_bytes())['CFBundleIdentifier'])
              break
          PY
          )
          if [[ -n "$runner_id" ]]; then
            container=$(xcrun simctl get_app_container booted "$runner_id" data || true)
            if [[ -d "$container/Documents/StackDiagnostic" ]]; then cp -R "$container/Documents/StackDiagnostic" "$out/raw"; fi
          fi
      - name: Export completed result attachments
        if: always()
        run: |
          shopt -s nullglob
          bundles=(.jac/safari-trace/*.xcresult)
          [ ${#bundles[@]} -eq 0 ] || python3 scripts/ci/ios-xcresult-attachments.py --output .jac/safari-trace/evidence "${bundles[@]}"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safari-trace-${{ matrix.runner }}-${{ github.sha }}
          path: |
            .jac/safari-trace/raw
            .jac/safari-trace/evidence
            .jac/safari-trace/*.log
            .jac/safari-trace/summary.txt
            .jac/safari-trace/toolchain.txt
          retention-days: 7
