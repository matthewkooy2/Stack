name: PDF safety and synthetic fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned PDF dependency
        run: python -c "import subprocess,sys,tomllib; spec=tomllib.load(open('jac.toml','rb'))['dependencies']['pypdf']; subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','pypdf'+spec])"
      - name: Exercise PDF resource limits
        run: python -m unittest discover -s tests -p test_pdf_safety.py -v
      - name: Verify synthetic fixture provenance
        run: python -m unittest discover -s tests -p test_fixture_provenance.py -v
      - name: Preserve job matching behavior
        run: python tests/test_matching.py
