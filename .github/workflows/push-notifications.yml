name: Push receipt recovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  push-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAC_DB_SCRATCH: '1'
      JAC_TEST_JOBS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Jac runtime
        run: |
          set -euo pipefail
          runtime=jac-0.37.21-linux-x86_64
          url=https://github.com/jaseci-labs/jac/releases/download/v0.37.21
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 "$url/$runtime" --output "$runtime"
          curl --fail --location --retry 2 "$url/$runtime.sha256" --output "$runtime.sha256"
          sha256sum --check "$runtime.sha256"
          chmod +x "$runtime"
          mkdir -p "$RUNNER_TEMP/jac-bin"
          mv "$runtime" "$RUNNER_TEMP/jac-bin/jac"
          echo "$RUNNER_TEMP/jac-bin" >> "$GITHUB_PATH"
      - name: Install server dependencies
        run: jac install --no-npm
      - name: Check push, worker, API and gateway modules
        run: jac check agents/notifications.jac agents/worker.jac core/automation.jac main.jac agents/gateway.jac
      - name: Exercise controlled HTTP delivery and killed-worker recovery
        run: jac run --no-serve tests/test_push_notifications.py
      - name: Preserve worker response logging
        run: jac run --no-serve tests/test_model_logs.py
