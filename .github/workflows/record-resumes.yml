name: Reviewed resume documents
on:
  pull_request:
  push:
    branches: [main, codex/mat-25-multiformat-tailoring-20261006]
permissions:
  contents: read
jobs:
  record-resumes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAC_DB_SCRATCH: '1'
      JAC_TEST_JOBS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Jac runtime
        run: |
          set -euo pipefail
          runtime=jac-0.37.21-linux-x86_64
          url=https://github.com/jaseci-labs/jac/releases/download/v0.37.21
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 "$url/$runtime" --output "$runtime"
          curl --fail --location --retry 2 "$url/$runtime.sha256" --output "$runtime.sha256"
          sha256sum --check "$runtime.sha256"
          chmod +x "$runtime"
          mkdir -p "$RUNNER_TEMP/jac-bin"
          mv "$runtime" "$RUNNER_TEMP/jac-bin/jac"
          echo "$RUNNER_TEMP/jac-bin" >> "$GITHUB_PATH"
      - name: Install server dependencies
        run: jac install --no-npm
      - name: Check affected server modules
        run: jac check main.jac agents/worker.jac agents/provider.jac agents/tracing.jac agents/resume_processing.jac core/automation.jac agents/gateway.jac agents/experience.jac
      - name: Verify imported records and approved PDF/DOCX workflows
        run: |
          set -euo pipefail
          jac run --no-serve tests/test_record_resume.py 2>&1 | tee "$RUNNER_TEMP/record-resumes.log"
          grep -qx 'OK' "$RUNNER_TEMP/record-resumes.log"
      - name: Preserve durable source processing
        run: |
          set -euo pipefail
          jac run --no-serve tests/test_resume_processing.py 2>&1 | tee "$RUNNER_TEMP/resume-processing.log"
          grep -qx 'OK' "$RUNNER_TEMP/resume-processing.log"
