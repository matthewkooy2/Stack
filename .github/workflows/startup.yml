name: Windows and WSL startup preparation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify disposable service and HTTP deadline cases
        run: python -m unittest discover -s deploy/startup -p test_startup.py -v
      - name: Verify disposable Windows startup orchestration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/startup/test-windows-startup.ps1
