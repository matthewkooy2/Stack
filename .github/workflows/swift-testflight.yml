name: Swift candidate TestFlight
on:
  push:
    branches: [feat/swiftui-ios-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-upload:
    # This explicit marker starts the native gate; signing/upload remain behind successful tests.
    if: github.repository == 'matthewkooy2/Stack' && github.ref == 'refs/heads/feat/swiftui-ios-rebuild' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[swift-testflight]'))
    runs-on: xcode-27
    environment: stack-testflight
    timeout-minutes: 60
    concurrency:
      group: stack-testflight-main
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      STACK_API_URL: ${{ secrets.STACK_API_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Validate private configuration and prepare existing key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STACK_API_URL" && test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          host="${STACK_API_URL#*://}"
          host="${host%%[:/]*}"
          for value in "$host" "${host%%.*}"; do
            [ -n "$value" ] || continue
            value="${value//%/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$value"
          done
          node scripts/ci/asc-preflight.cjs
          key_dir="$HOME/.appstoreconnect/private_keys"
          umask 077
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_AUTH_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test, archive, validate and upload native candidate
        run: bash scripts/ci/ios-swift-testflight.sh
      - name: Confirm exact native beta processing
        run: node scripts/ci/ios-swift-processing.cjs
      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
