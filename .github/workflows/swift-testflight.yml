name: Stack Swift TestFlight deployment
on:
  workflow_run:
    workflows: [Stack SwiftUI app]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_native:
        description: Upload the reviewed Swift beta to the existing Stack TestFlight app
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  native-upload:
    # Enabled main pushes release the Swift app; manual uploads remain explicit.
    if: github.repository == 'matthewkooy2/Stack' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && vars.STACK_TESTFLIGHT_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.upload_native))
    runs-on: xcode-27
    environment: stack-testflight
    timeout-minutes: 60
    concurrency:
      group: stack-testflight-main
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      STACK_API_URL: ${{ secrets.STACK_API_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify exact native source before signing
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ios-native-proof.py release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Validate private configuration and prepare existing key
        if: steps.verified.outputs.upload == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STACK_API_URL" && test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          host="${STACK_API_URL#*://}"
          host="${host%%[:/]*}"
          for value in "$host" "${host%%.*}"; do
            [ -n "$value" ] || continue
            value="${value//%/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$value"
          done
          node scripts/ci/asc-preflight.cjs
          key_dir="$HOME/.appstoreconnect/private_keys"
          umask 077
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_AUTH_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Restore approved reusable distribution signing assets
        if: steps.verified.outputs.upload == 'true'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_ACTIVITY_PROFILE_BASE64 }}
        run: python3 scripts/ci/ios-signing.py prepare
      - name: Archive, validate and upload verified native candidate
        if: steps.verified.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/ios-swift-testflight.sh
      - name: Confirm exact native beta processing
        if: steps.verified.outputs.upload == 'true'
        run: node scripts/ci/ios-swift-processing.cjs
      - name: Remove temporary signing assets
        if: always()
        run: python3 scripts/ci/ios-signing.py cleanup
      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
