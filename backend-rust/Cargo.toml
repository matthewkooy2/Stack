[package]
name = "stack-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
csv = "1"
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
subtle = "2.6"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","rustls-tls","stream"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "fs", "net", "rt-multi-thread", "signal", "sync"] }

[profile.release]
lto = "thin"
strip = true
