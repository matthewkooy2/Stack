name: stack
x-runtime: &runtime
  image: ${STACK_IMAGE:?Set the Stack image digest}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    restart: unless-stopped
    environment:
      POSTGRES_DB: stack
      POSTGRES_USER: stack
      POSTGRES_PASSWORD: ${STACK_DB_PASSWORD:?Set the Postgres password}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stack", "-d", "stack"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *runtime
    command: ["run", "--no-client", "--workers", "1", "--host", "0.0.0.0", "--port", "8000", "Stack"]
    env_file: ${STACK_API_ENV_FILE:-/etc/stack/api.env}
    environment:
      JAC_DB_URL: postgresql://stack:${STACK_DB_PASSWORD}@db:5432/stack
      STACK_APPLE_REQUIRE_REVOCATION: "1"
      STACK_FIRST_PARTY_AI_ONLY: "${STACK_FIRST_PARTY_AI_ONLY:-1}"
      STACK_LINKEDIN_ENABLED: "0"
      JAC_SERVE_DOCS: "false"
      JAC_SERVE_GRAPH: "false"
      # Coaching waits on the model inside a request; more threads keep logins and feeds responsive meanwhile.
      JAC_SERVE_THREADS: "${JAC_SERVE_THREADS:-32}"
      # Overflow GPU for AI requests (agents/local_model.jac). Stays off until the private
      # env file sets STACK_OVERFLOW_API_KEY; never put the key here.
      STACK_OVERFLOW_URL: "${STACK_OVERFLOW_URL:-https://api.runpod.ai/v2/7ig8qdegtowwhu/openai/v1}"
      STACK_OVERFLOW_MODEL: "${STACK_OVERFLOW_MODEL:-qwen3-4b-instruct}"
      STACK_LOCAL_MAX_IN_FLIGHT: "${STACK_LOCAL_MAX_IN_FLIGHT:-2}"
    volumes:
      - ${STACK_STORAGE_DIR:-/var/lib/stack/storage}:/opt/stack/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; import json; response = json.load(urlopen('http://127.0.0.1:8000/function/health', data=b'{}', timeout=3)); assert response['data']['result']['status'] == 'ok'"]
      interval: 5s
      timeout: 5s
      start_period: 150s
      retries: 12

  gateway:
    <<: *runtime
    command: ["run", "--no-serve", "scripts/gateway-service.jac"]
    env_file: ${STACK_GATEWAY_ENV_FILE:-/etc/stack/gateway.env}
    environment:
      STACK_LINKEDIN_ENABLED: "0"
      STACK_GATEWAY_BIND: 0.0.0.0
      STACK_GATEWAY_PORT: "8080"
      STACK_TRANSCRIPTION_READINESS_PATH: /opt/stack/transcription-status/readiness.json
      STACK_WORKER_API: http://api:8000
    volumes:
      - transcription-status:/opt/stack/transcription-status:ro
    ports:
      - "127.0.0.1:${STACK_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 6

  worker:
    <<: *runtime
    command: ["run", "--no-serve", "scripts/agent-worker.jac"]
    env_file: ${STACK_WORKER_ENV_FILE:-/etc/stack/worker.env}
    environment:
      STACK_FIRST_PARTY_AI_ONLY: "${STACK_FIRST_PARTY_AI_ONLY:-1}"
      STACK_TRANSCRIPTION_AUTO_SETUP: "0"
      STACK_TRANSCRIPTION_READINESS_PATH: /opt/stack/transcription-status/readiness.json
      STACK_WORKER_API: http://api:8000
      # Overflow GPU for AI requests (agents/local_model.jac). Stays off until the private
      # env file sets STACK_OVERFLOW_API_KEY; never put the key here.
      STACK_OVERFLOW_URL: "${STACK_OVERFLOW_URL:-https://api.runpod.ai/v2/7ig8qdegtowwhu/openai/v1}"
      STACK_OVERFLOW_MODEL: "${STACK_OVERFLOW_MODEL:-qwen3-4b-instruct}"
      STACK_LOCAL_MAX_IN_FLIGHT: "${STACK_LOCAL_MAX_IN_FLIGHT:-2}"
    # Each worker runs one AI task at a time; leased claims make extra copies safe.
    deploy:
      replicas: ${STACK_WORKER_REPLICAS:-2}
    volumes:
      - transcription-status:/opt/stack/transcription-status
      - ${STACK_STORAGE_DIR:-/var/lib/stack/storage}:/opt/stack/storage
    depends_on:
      api:
        condition: service_healthy

  jobs:
    <<: *runtime
    command: ["run", "--no-serve", "scripts/jobs-sweep.jac"]
    env_file: ${STACK_DISCOVERY_ENV_FILE:-/etc/stack/discovery.env}
    environment:
      STACK_WORKER_API: http://api:8000
    volumes:
      - ${STACK_STORAGE_DIR:-/var/lib/stack/storage}:/opt/stack/storage:ro
    profiles: ["jobs"]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres:
  transcription-status:
