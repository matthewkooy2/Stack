name: Stack
options:
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  bundleIdPrefix: com.matthewkooy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Override this build setting in Xcode or pass STACK_API_URL=https://... to xcodebuild.
    STACK_API_URL: "http://127.0.0.1:8000"
    # Opt in only after the reviewed App ID/provisioning and backend activation gates.
    STACK_APPLE_SIGN_IN_ENABLED: "NO"
    STACK_APPLE_ENTITLEMENTS: ""
targets:
  Stack:
    type: application
    platform: iOS
    sources:
      - path: Stack
    info:
      path: Stack/Info.plist
      properties:
        CFBundleDisplayName: Stack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        StackAPIBaseURL: $(STACK_API_URL)
        StackAppleSignInEnabled: $(STACK_APPLE_SIGN_IN_ENABLED)
        NSMicrophoneUsageDescription: Stack records your spoken interview answers so you can review them and get coaching.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewkooy.stack.swift
        CODE_SIGN_ENTITLEMENTS: $(STACK_APPLE_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StackTests
    dependencies:
      - target: Stack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StackUITests
    dependencies:
      - target: Stack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stack:
    build:
      targets:
        Stack: all
    test:
      targets:
        - StackTests
        - StackUITests
