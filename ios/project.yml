name: Stack
options:
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  bundleIdPrefix: com.matthewkooy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Override this build setting in Xcode or pass STACK_API_URL=https://... to xcodebuild.
    STACK_API_URL: "http://127.0.0.1:8000"
    # Opt in only after the reviewed App ID/provisioning and backend activation gates.
    STACK_APPLE_SIGN_IN_ENABLED: "NO"
    STACK_APPLE_ENTITLEMENTS: ""
    # The app's bundle ID; the Dynamic Island widget extension uses it plus ".activity". Release builds and
    # scripts/ios-phone.sh pass com.matthewkooy.stack, the ID the backend's Apple sign-in expects.
    STACK_BUNDLE_ID: "com.matthewkooy.stack.swift"
    STACK_LISTING_FIXTURE_PORT: "18765"
    STACK_LISTING_REQUIRE_ACCEPTANCE: "0"
    STACK_LISTING_ERROR_TEXT: ""
targets:
  Stack:
    type: application
    platform: iOS
    sources:
      - path: Stack
      - path: Shared
    dependencies:
      - target: StackActivity
    info:
      path: Stack/Info.plist
      properties:
        CFBundleDisplayName: Stack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBlue
        # Keep recording an answer when the app is not on screen (the red status bar pill shows it).
        UIBackgroundModes:
          - audio
        # Show recording and coaching progress in the Dynamic Island and on the Lock Screen.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        StackAPIBaseURL: $(STACK_API_URL)
        StackAppleSignInEnabled: $(STACK_APPLE_SIGN_IN_ENABLED)
        NSMicrophoneUsageDescription: Stack records your spoken interview answers so you can review them and get coaching.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STACK_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(STACK_APPLE_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StackActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: StackActivity
      - path: Shared
    info:
      path: StackActivity/Info.plist
      properties:
        CFBundleDisplayName: Stack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STACK_BUNDLE_ID).activity
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  StackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StackTests
    dependencies:
      - target: Stack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StackUITests
    dependencies:
      - target: Stack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stack:
    build:
      targets:
        Stack: all
    test:
      macroExpansion: Stack
      environmentVariables:
        STACK_LISTING_FIXTURE_PORT: $(STACK_LISTING_FIXTURE_PORT)
        STACK_LISTING_REQUIRE_ACCEPTANCE: $(STACK_LISTING_REQUIRE_ACCEPTANCE)
        STACK_LISTING_ERROR_TEXT: $(STACK_LISTING_ERROR_TEXT)
      targets:
        - StackTests
        - StackUITests
