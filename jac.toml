[project]
name = "Stack"
version = "0.1.0"
description = "Stack — your next chapter starts here"
jac-version = "==0.37.21"
default-app = "Stack"

[dependencies]
pypdf = "==6.19.0"
reportlab = "==4.4.10"
cryptography = "==50.0.2"
websockets = "==17.0.1"
google-auth = "==2.40.3"
requests = "==2.33.1"

python-dotenv = "==1.2.4"

[dependencies.npm]
react = "19.2.3"
react-dom = "19.2.3"
react-router-dom = "7.18.4"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
# Synthetic fixture generators use the same locked PDF renderer as the worker.
watchdog = "==6.0.0"

# Preserve the Python-backed execution of migrated backend helpers.
[placement.pins]
"agents.*" = "server"
"mobile.prototype.Views" = "client"

[apps.Stack]
kind = "service"
entry-point = "main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "ios"

[apps.workspace]
kind = "web-app"
entry-point = "web.main"

[apps.workspace.dependencies.npm]
react = "19.2.3"
react-dom = "19.2.3"

[apps.mobile.dependencies.npm]
react = "19.2.3"
react-dom = "19.2.3"
react-native-web = "0.21.0"
react-native-svg = "15.15.5"
lucide-react = "1.48.0"
lucide-react-native = "1.48.0"

[client.react_native]
project_dir = ".jac/mobile-rn"
default_platform = "ios"
release = false

[client.app]
name = "Stack"
id = "com.matthewkooy.stack"

[apps.mobile.dependencies.npm.native]
react-native-svg = "15.15.5"
lucide-react-native = "1.48.0"

[scale.admin]
enabled = false

# Jac owns identity-only Google SSO; optional Gmail/Calendar use /oauth/google.
# Runtime environment supplies credentials. Empty values leave SSO disabled.
[scale.sso]
host = "${STACK_SSO_HOST:-http://localhost:8000}"
client_auth_callback_url = "${STACK_SSO_CALLBACK_URL:-}"

[scale.sso.google]
client_id = "${GOOGLE_CLIENT_ID:-}"
client_secret = "${GOOGLE_CLIENT_SECRET:-}"

[database]
indexes = { JobAlias = ["key"], CatalogJob = ["key", "canonical_url", "identity", "active", "checked_at"], JobSource = ["key", "next_at"], DiscoveryRequest = ["status", "key"], AgentRun = ["key", "status", "created_at"], AgentTicket = ["state", "due_at"], AgentUsage = ["key"], AgentEvent = ["key"], PrepSession = ["updated_at"], ResumeTicket = ["status", "created_at", "lease_until"] }
